apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: node:18-alpine
        command: ["sh", "-c"]
        args:
          - |
            mkdir -p /app
            cd /app

            # Clean install every start
            rm -rf node_modules package-lock.json package.json

            npm init -y
            npm install express nats

            cat <<EOF > server.js
            const express = require('express');
            const { connect } = require('nats');

            const app = express();
            app.use(express.json());

            let nc;

            (async () => {
              nc = await connect({
                servers: "nats.nats.svc.cluster.local:4222"
              });
              console.log("Connected to NATS");
            })();

            // ✅ ROOT ROUTE (IMPORTANT)
            app.get("/", (req, res) => {
              res.send("API root working");
            });

            // ✅ /api ROUTE
            app.get("/api", (req, res) => {
              res.send("API is running");
            });

            // ✅ SEND MESSAGE
            app.post("/api/send", (req, res) => {
              const msg = req.body.message || "hello";
              nc.publish("tasks", Buffer.from(msg));
              res.send("Message sent");
            });

            app.listen(3000, () => {
              console.log("API running on port 3000");
            });
            EOF

            node server.js
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: apps
spec:
  selector:
    app: api
  ports:
  - port: 3000
    targetPort: 3000
