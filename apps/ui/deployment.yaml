apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
      - name: ui
        image: nginx
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            memory: "32Mi"
          limits:
            memory: "64Mi"
      volumes:
      - name: html
        configMap:
          name: ui-html
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: apps
spec:
  selector:
    app: ui
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-html
  namespace: apps
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <body>
      <h2>Real-time Messaging UI</h2>

      <input id="msg" placeholder="Enter message"/>
      <button onclick="send()">Send</button>

      <h3>Messages:</h3>
      <ul id="messages"></ul>

      <script>
        const ws = new WebSocket("ws://" + window.location.host + "/ws");

        ws.onmessage = (event) => {
          const li = document.createElement("li");
          li.innerText = event.data;
          document.getElementById("messages").appendChild(li);
        };

        function send() {
          const msg = document.getElementById("msg").value;
          fetch("/api/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: msg })
          });
        }
      </script>
    </body>
    </html>
